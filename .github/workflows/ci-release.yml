name: CI and Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n backup-configs.sh
          bash -n restore-configs.sh
          bash -n config-ops-runtime.sh
          bash -n backupctl

      - name: Run ShellCheck
        run: shellcheck install.sh uninstall.sh backup-configs.sh restore-configs.sh config-ops-runtime.sh backupctl

  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Smoke-test repository launcher
        run: |
          cargo build -p backupctl
          ./backupctl --help >/dev/null
          ./backupctl --version

  frontend:
    name: Documentation app
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install locked dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Type-check, test, and build the documentation app
        working-directory: docs
        run: pnpm run check

      - name: Upload tested single-file guide
        uses: actions/upload-artifact@v4
        with:
          name: homelab-backup-toolkit
          path: docs/dist/GUIDE.html
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - static-checks
      - rust
      - frontend
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vX.Y.Z format: $RELEASE_TAG" >&2
            exit 1
          fi

          declared_version="$(awk -F '\"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "v$declared_version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo.toml version ($declared_version)." >&2
            exit 1
          fi

      - name: Install Rust 1.96.0
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Build release binary
        run: cargo build --locked --release -p backupctl

      - name: Download tested documentation app
        uses: actions/download-artifact@v5
        with:
          name: homelab-backup-toolkit
          path: guide-artifact

      - name: Build release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          archive="homelab-backup-${version}.tar"
          mkdir -p dist
          git -c tar.umask=0022 archive \
            --format=tar \
            --prefix="homelab-backup-${version}/" \
            --output="dist/$archive" \
            "$GITHUB_SHA" \
            .
          chmod 0644 guide-artifact/GUIDE.html
          tar --append \
            --file="dist/$archive" \
            --transform="s|^|homelab-backup-${version}/|" \
            -C guide-artifact \
            GUIDE.html
          install -d -m 0755 dist/payload/bin
          install -m 0755 target/release/backupctl dist/payload/bin/backupctl
          tar --append \
            --file="dist/$archive" \
            --transform="s|^|homelab-backup-${version}/|" \
            -C dist/payload \
            bin/backupctl
          gzip --no-name "dist/$archive"
          cd dist
          sha256sum "${archive}.gz" > SHA256SUMS

      - name: Publish release and assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/homelab-backup-*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "homelab-backup $RELEASE_TAG"
