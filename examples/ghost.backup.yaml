version: 1
service: ghost
enabled: true

schedule:
  # 每 6 小時一次
  cron: "0 */6 * * *"
  retry_after: 30m
  max_lateness: 3h

retention:
  keep_last: 8
  keep_daily: 14
  keep_weekly: 8
  keep_monthly: 12
  keep_yearly: 3

compose:
  files: [compose.yaml]
  env_file: .env

consistency:
  mode: hooks
  timeout: 180

actions:
  backup:
    before:
      - name: dump-database-live
        script: |-
          dump_dir="./backup-dumps"
          tmp_dump="$dump_dir/ghost.sql.tmp"
          final_dump="$dump_dir/ghost.sql"

          install -d -m 0700 -- "$dump_dir"
          rm -f -- "$tmp_dump"
          trap 'rm -f -- "$tmp_dump"' EXIT

          docker compose exec -T db sh -c \
            'exec mysqldump \
              --single-transaction \
              --quick \
              --skip-lock-tables \
              -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"' \
            > "$tmp_dump"

          test -s "$tmp_dump"
          chmod 0600 "$tmp_dump"
          mv -f -- "$tmp_dump" "$final_dump"
          trap - EXIT
        timeout: 180
        required: true
        run_as: root
    after: []
    finally: []
    on_success: []
    on_failure: []
  restore:
    before: []
    after:
      - name: restore-database
        script: |-
          docker compose up --wait --wait-timeout 180 db
          docker compose exec -T db sh -c '
            until mysqladmin ping \
              -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; do
              sleep 1
            done
            mysqladmin -uroot -p"$MYSQL_ROOT_PASSWORD" --force \
              drop "$MYSQL_DATABASE"
            mysqladmin -uroot -p"$MYSQL_ROOT_PASSWORD" \
              create "$MYSQL_DATABASE"
            exec mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE"
          ' < ./backup-dumps/ghost.sql
        timeout: 3600
        required: true
        run_as: root
    finally: []
    on_success: []
    on_failure: []

sources:
  paths:
    - id: compose
      path: compose.yaml
    - id: env
      path: .env
      required: false
    - id: content
      path: ./content
    - id: database-dump
      path: ./backup-dumps
  volumes: []
